name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            libsdl3-dev libfreetype-dev fonts-dejavu-core

      - name: Build + test (Release)
        run: ./build.sh

      - name: Build + test (Sanitizers)
        run: ./build.sh --clean --sanitize
